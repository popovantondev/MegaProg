<!-- One centred macOS tile; no extra transparent border around the exported artwork. -->
<rect x="96" y="106" width="832" height="832" rx="192" fill="#06131b" opacity=".20"/>
<rect x="96" y="96" width="832" height="832" rx="192" fill="url(#tile)"/>
<rect x="100" y="100" width="824" height="824" rx="188" fill="none" stroke="url(#rim)" stroke-width="3"/>
