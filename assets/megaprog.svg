 <radialGradient id="mintNode" cx=".3" cy=".2" r=".95"><stop stop-color="#f0fff8"/><stop offset=".34" stop-color="#c5eee2"/><stop offset=".73" stop-color="#9ad8c9"/><stop offset="1" stop-color="#59aaa4"/></radialGradient>
 <radialGradient id="tealNode" cx=".3" cy=".2" r=".95"><stop stop-color="#b0f4e0"/><stop offset=".34" stop-color="#66d4b8"/><stop offset=".73" stop-color="#35b69e"/><stop offset="1" stop-color="#248b82"/></radialGradient>
 <linearGradient id="metal" x1="355" y1="330" x2="690" y2="704" gradientUnits="userSpaceOnUse"><stop stop-color="#f1fff8"/><stop offset=".4" stop-color="#bcded9"/><stop offset=".73" stop-color="#7daeb0"/><stop offset="1" stop-color="#d6f7eb"/></linearGradient>
 <linearGradient id="check" x1="437" y1="463" x2="593" y2="583" gradientUnits="userSpaceOnUse"><stop stop-color="#e0fff0"/><stop offset="1" stop-color="#7cdebd"/></linearGradient>
 <radialGradient id="well"><stop stop-color="#203f47"/><stop offset="1" stop-color="#112730"/></radialGradient>
