<g fill="url(#mintNode)" stroke="#e1fff1" stroke-opacity=".4" stroke-width="2"><circle cx="300" cy="300" r="72"/><circle cx="724" cy="724" r="72"/></g>
<g fill="url(#tealNode)" stroke="#9eeee0" stroke-opacity=".4" stroke-width="2"><circle cx="724" cy="300" r="88"/><circle cx="300" cy="724" r="88"/></g>
<circle cx="512" cy="526" r="191" fill="#071b24" opacity=".65"/>
<circle cx="512" cy="512" r="187" fill="url(#metal)"/>
<circle cx="512" cy="512" r="147" fill="url(#well)" stroke="#07222c" stroke-width="3"/>
<circle cx="512" cy="512" r="184" fill="none" stroke="#edfff7" stroke-width="2" opacity=".6"/>
<path d="m435 523 57 57 107-126" fill="none" stroke="#07232b" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
<path d="m435 512 57 57 107-126" fill="none" stroke="url(#check)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
