name: "Fehler melden · Deutsch"
description: "Beschreibe ein reproduzierbares Problem."
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Keine Passwörter, Tokens, Sitzungsdateien, privaten Pfade oder persönlichen Daten veröffentlichen. Verwende erfundene Beispiele und bereinigte Screenshots."
  - type: input
    id: version
    attributes:
      label: "Programmversion"
      placeholder: "4.5.1"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: "Betriebssystem und Hardware"
      placeholder: "macOS · Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Schritte zum Nachstellen"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Erwartetes Ergebnis"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Tatsächliches Ergebnis"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Bereinigte Fehlermeldung oder Screenshot"
    validations:
      required: false
