name: "Feature request · English"
description: "Suggest an improvement."
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, session files, private paths or personal data. Use synthetic examples and redact screenshots."
  - type: textarea
    id: problem
    attributes:
      label: "What problem would it solve?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Suggested improvement"
      placeholder: "Describe the desired behavior and a concrete example."
    validations:
      required: true
