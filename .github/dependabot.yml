version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Qt for Python 6.11 drops Python 3.9, which this project still supports.
      - dependency-name: pyside6
        versions: [">=6.11"]
