name: offline-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-14
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install desktop test dependencies
        run: python -m pip install "PySide6==6.10.2"
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
