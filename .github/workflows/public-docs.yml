name: Public documentation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
jobs:
  public-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check documentation validator
        run: python tools/test_public_docs.py
      - name: Verify release metadata and user pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check_public_docs.py --online --published
